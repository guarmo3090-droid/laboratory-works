name: Build Project

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install OpenCV & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libopencv-dev cmake g++ wget

    - name: Install JSON Library
      run: |
        wget -q https://github.com/nlohmann/json/releases/latest/download/json.hpp -O json.hpp

    - name: Configure CMake
      run: |
        mkdir build
        cd build

    - name: Build
      run: |
        cd build
        make
